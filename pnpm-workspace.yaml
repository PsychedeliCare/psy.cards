packages:
  - 'packages/*'

# Cloudflare Workers Builds pins pnpm 10.11.1, which ignores `allowBuilds`.
# `onlyBuiltDependencies` is the 10.11 allowlist; `allowBuilds` covers 10.26+.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Browser holograms and vgpu/mock tests never use Dawn. Drop the Node adapter
# and its 68MB webgpu binaries so Cloudflare never runs those postinstalls.
overrides:
  '@vgpu/adapter-node': '-'
  webgpu: '-'
