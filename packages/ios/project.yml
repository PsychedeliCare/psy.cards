name: PsyCards
options:
  bundleIdPrefix: cards.psy
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
targets:
  PsyCards:
    type: application
    platform: iOS
    sources:
      - path: PsyCards
        excludes:
          - "**/.DS_Store"
          - "Resources/**"
          - "**/*.lproj/**"
      - path: PsyCards/en.lproj
        buildPhase: resources
      - path: PsyCards/fr.lproj
        buildPhase: resources
      - path: PsyCards/de.lproj
        buildPhase: resources
      - path: PsyCards/it.lproj
        buildPhase: resources
      - path: PsyCards/Resources/DataPack
        type: folder
        buildPhase: resources
      - path: PsyCards/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.psy.PsyCards
        INFOPLIST_KEY_CFBundleDisplayName: psy.cards
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: PsyCards/Info.plist
      properties:
        CFBundleLocalizations:
          - en
          - fr
          - de
          - it
        CFBundleDevelopmentRegion: en
  PsyCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PsyCardsTests
    dependencies:
      - target: PsyCards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cards.psy.PsyCardsTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PsyCards:
    build:
      targets:
        PsyCards: all
        PsyCardsTests: [test]
    test:
      targets:
        - PsyCardsTests
    run:
      config: Debug
